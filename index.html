<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Doorstep: an AI agent that resolves failed deliveries with buyers over WhatsApp and calls.">
<title>Doorstep Seller Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: SaaS seller desk. Auth split screen -> onboarding upload -> app shell (sidebar + views: Overview, Failed deliveries, Agent settings, Data sources). */
:root{
  --bg:#FFFFFF; --canvas:#F7F6F4; --surface:#F3F2EF; --surface-2:#EAE8E4; --line:#E3E0DB;
  --ink:#17161A; --ink-2:#4E4B52; --muted:#7D7982;
  --accent:#C2410C; --accent-strong:#E0522D; --accent-soft:#FDEEE7;
  --good:#157A3C; --good-soft:#E5F3EA; --warn:#935A04; --warn-soft:#FBF0DD; --info:#1F4FC4; --info-soft:#E7EDFB; --bad:#B42318; --bad-soft:#FDECEA;
  --side:#17161A; --side-ink:#F4F2EE; --side-muted:#A29EA6;
  --bub-a:#EFEDE9; --bub-b:#17161A; --bub-b-ink:#FFFFFF;
  --display:"Bricolage Grotesque","Arial Narrow",Arial,sans-serif; --body:"Instrument Sans","Segoe UI",Roboto,Arial,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141316; --canvas:#101012; --surface:#1C1B1F; --surface-2:#252428; --line:#2F2D33; --ink:#F4F2EE; --ink-2:#BDB9C2; --muted:#8E8A94;
  --accent:#FF8A5C; --accent-strong:#E0522D; --accent-soft:#3A2016;
  --good:#5BD68A; --good-soft:#16301F; --warn:#F2B84B; --warn-soft:#33270F; --info:#97B4FF; --info-soft:#1B2440; --bad:#F59A92; --bad-soft:#3A1A17;
  --side:#0B0B0D; --side-ink:#F4F2EE; --side-muted:#8E8A94;
  --bub-a:#252428; --bub-b:#F4F2EE; --bub-b-ink:#141316; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141316; --canvas:#101012; --surface:#1C1B1F; --surface-2:#252428; --line:#2F2D33; --ink:#F4F2EE; --ink-2:#BDB9C2; --muted:#8E8A94;
  --accent:#FF8A5C; --accent-strong:#E0522D; --accent-soft:#3A2016;
  --good:#5BD68A; --good-soft:#16301F; --warn:#F2B84B; --warn-soft:#33270F; --info:#97B4FF; --info-soft:#1B2440; --bad:#F59A92; --bad-soft:#3A1A17;
  --side:#0B0B0D; --side-ink:#F4F2EE; --side-muted:#8E8A94;
  --bub-a:#252428; --bub-b:#F4F2EE; --bub-b-ink:#141316; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .fine{font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent-strong);border-color:var(--accent-strong);color:#FFFFFF}
.btn.primary:hover:not(:disabled){background:var(--accent);border-color:var(--accent)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){border-color:var(--line)}
.btn.sm{font-size:13px;padding:6px 10px;border-radius:8px}
.btn.block{width:100%}
:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);min-width:0}
.field .hint{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-open{background:var(--surface-2);color:var(--ink-2)}.c-talking{background:var(--info-soft);color:var(--info)}.c-pay{background:var(--info-soft);color:var(--info)}
.c-rebooked{background:var(--good-soft);color:var(--good)}.c-return{background:var(--bad-soft);color:var(--bad)}.c-human{background:var(--warn-soft);color:var(--warn)}
.c-soon{background:var(--surface-2);color:var(--muted)}
.tag{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--ink-2);white-space:nowrap}
.tag.bad{border-color:var(--bad);color:var(--bad)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px}
.note{font-size:13.5px;padding:10px 12px;border-radius:10px;background:var(--surface);color:var(--ink-2)}
.note.err{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--good-soft);color:var(--good)}
.note.info{background:var(--info-soft);color:var(--info)}
[hidden]{display:none!important}
/* ---------- loading ---------- */
.center{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
/* ---------- auth ---------- */
.auth{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:900px){.auth{grid-template-columns:1fr}}
.auth-l{background:var(--side);color:var(--side-ink);padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
@media (max-width:900px){.auth-l{padding:28px 20px}}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--accent-strong);display:inline-flex;align-items:center;justify-content:center}
.logo i::after{content:"";width:12px;height:12px;border:3px solid #FFFFFF;border-top-color:transparent;border-radius:50%}
.auth-l h1{font-size:clamp(30px,4vw,48px);font-weight:800;max-width:14ch}
.auth-l .sub{color:var(--side-muted);max-width:44ch;font-size:16px}
.proof{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;max-width:520px}
.proof div{border-top:2px solid var(--accent-strong);padding-top:10px;font-size:13.5px;color:var(--side-muted)}
.proof b{display:block;color:var(--side-ink);font-family:var(--display);font-size:17px;margin-bottom:2px}
.auth-r{padding:40px 24px;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.auth-box{width:100%;max-width:460px;display:flex;flex-direction:column;gap:18px}
.seg{display:flex;background:var(--surface);border-radius:10px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:7px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.idrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--surface);font-size:13.5px}
.idrow img{width:30px;height:30px;border-radius:50%}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2)}
.check input{margin-top:3px}
.storecard{display:flex;flex-direction:column;gap:14px;padding:18px;border:1px solid var(--line);border-radius:14px}
/* ---------- onboarding ---------- */
.onb{max-width:1040px;margin:0 auto;padding:28px 18px 48px;display:flex;flex-direction:column;gap:22px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--muted);padding:6px 12px 6px 6px;border-radius:999px;background:var(--surface)}
.step b{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface-2);font-size:12px}
.step.done{color:var(--good)} .step.done b{background:var(--good);color:#FFFFFF}
.step.on{color:var(--ink)} .step.on b{background:var(--accent-strong);color:#FFFFFF}
.uploads{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:820px){.uploads{grid-template-columns:1fr}}
.up{padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px 14px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;background:var(--canvas)}
.drop.over{border-color:var(--accent-strong);background:var(--accent-soft)}
.drop.done{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.cols{display:flex;flex-wrap:wrap;gap:5px}
.col-ok{background:var(--good-soft);color:var(--good)}.col-miss{background:var(--bad-soft);color:var(--bad)}.col-opt{background:var(--surface-2);color:var(--ink-2)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface);font-weight:600}
tr:last-child td{border-bottom:0}
.joinbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 18px}
/* ---------- shell ---------- */
.shell{min-height:100%;display:grid;grid-template-columns:232px minmax(0,1fr)}
@media (max-width:900px){.shell{grid-template-columns:1fr}}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
@media (max-width:900px){.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px}}
.nav{display:flex;flex-direction:column;gap:2px}
@media (max-width:900px){.nav{flex-direction:row;flex-wrap:wrap;order:3;width:100%}}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;color:var(--side-muted);padding:9px 10px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;text-align:left}
.nav button:hover{color:var(--side-ink)}
.nav button[aria-current="page"]{background:rgba(255,255,255,.09);color:var(--side-ink)}
.nav .n{font-size:11.5px;background:var(--accent-strong);color:#FFFFFF;border-radius:999px;padding:0 7px;font-variant-numeric:tabular-nums}
.who{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--side-muted);border-top:1px solid rgba(255,255,255,.1);padding-top:14px}
@media (max-width:900px){.who{margin:0 0 0 auto;border:0;padding:0;flex-direction:row;align-items:center}}
.who b{color:var(--side-ink);font-weight:600;display:block}
.who .btn{background:transparent;color:var(--side-muted);border-color:rgba(255,255,255,.18)}
.main{padding:26px 28px 48px;display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:640px){.main{padding:18px 16px 40px}}
.phead{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.phead h1{font-size:clamp(24px,3vw,32px);font-weight:800}
.phead p{color:var(--ink-2);margin-top:4px;max-width:70ch}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--info-soft);color:var(--info);font-size:13.5px}
/* overview */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:480px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi.lead{background:var(--ink);color:var(--bg);border-color:var(--ink)}.kpi.lead .l{color:var(--bg);opacity:.75}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.two{grid-template-columns:1fr}}
.pad{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.sect{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--surface-2);gap:2px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.bigv{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.feedlist{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:74px minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.fi:last-child{border-bottom:0}
.fi time{font-family:var(--mono);font-size:11.5px;color:var(--muted);padding-top:2px}
.needs{display:flex;flex-direction:column;gap:6px}
.needs button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:13.5px}
.needs button:focus-visible{outline:2px solid var(--accent-strong)}
/* cases */
.cases{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.cases{grid-template-columns:1fr}}
.listbox{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--line)}
.filters button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.search{padding:0 12px 12px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.rows{display:flex;flex-direction:column;max-height:640px;overflow-y:auto}
.crow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:3px;padding:12px 14px;border-bottom:1px solid var(--line)}
.crow:hover{background:var(--surface)}
.crow[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent-strong)}
.crow .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.crow .n{font-weight:600}
.crow .d{font-size:12.5px;color:var(--ink-2)}
.crow .r{font-size:12px;color:var(--muted)}
.crow .fl{display:flex;gap:4px;flex-wrap:wrap}
.detail{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.dhead{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px}
.dhead h2{font-size:20px;font-weight:700}
.dhead .amt{font-family:var(--display);font-weight:800;font-size:20px;text-align:right;font-variant-numeric:tabular-nums}
.dhead .meta{font-size:13px;color:var(--ink-2)}
.dhead .meta b{color:var(--ink);font-weight:600}
.courier{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--ink-2)}
.courier b{color:var(--ink);font-weight:600}
.dbody{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:0}
@media (max-width:1300px){.dbody{grid-template-columns:1fr}}
.conv{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
@media (max-width:1300px){.conv{border-right:0;border-bottom:1px solid var(--line)}}
.testbar{font-size:12.5px;background:var(--warn-soft);color:var(--warn);padding:7px 14px}
.feed{height:420px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--canvas)}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg .w{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;opacity:.7;margin-bottom:1px}
.m-agent{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.m-buyer{align-self:flex-end;background:var(--bub-b);color:var(--bub-b-ink);border-bottom-right-radius:4px}
.m-sys{align-self:center;font-size:12.5px;color:var(--ink-2);background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:5px 10px;text-align:center;max-width:92%}
.typing{opacity:.7;font-style:italic}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:40ch;font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.ctl{padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.compose{display:flex;gap:8px}
.compose input{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acts{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.call{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.call .h{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--surface);font-family:var(--mono);font-size:11.5px}
.call .h b{color:var(--accent);font-weight:600}
.call pre{margin:0;padding:8px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink-2)}
.call .res{border-top:1px dashed var(--line);color:var(--good)}
.progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent-strong);transition:width .3s}
/* settings / data */
.setgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.setgrid{grid-template-columns:1fr}}
.toggle{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.toggle:last-child{border-bottom:0}
.toggle .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.toggle .tx b{font-weight:600}
.toggle .tx span{font-size:13px;color:var(--muted)}
.sw{position:relative;width:42px;height:24px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--surface-2);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.sw input:checked+i{background:var(--good)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--accent-strong);outline-offset:2px}
.sw input:disabled+i{opacity:.5}
.srcs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.srcs{grid-template-columns:1fr}}
.src{padding:18px;display:flex;flex-direction:column;gap:12px}
.src .top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.src .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;background:var(--surface-2)}
.src.live{border-style:dashed}

/* ---------- phone layout ---------- */
.mback{display:none}
.nav .ic{display:none}

function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true; else if(c===','){row.push(f);f="";} else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f);f=""; if(row.some(x=>x.trim()!=="")) rows.push(row); row=[]; } else f+=c; }
  row.push(f); if(row.some(x=>x.trim()!=="")) rows.push(row);
  if(!rows.length) return {headers:[],rows:[]};
  const headers=rows[0].map(x=>{let k=x.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");return ALIASES[k]||k;});
  return {headers, rows:rows.slice(1).map(r=>Object.fromEntries(headers.map((k,i)=>[k,(r[i]??"").trim()])))};
}

function shipments(){

  return {list, unmatched:Object.keys(ndr).filter(k=>!orders[k]).length, orders:Object.keys(orders).length, ndr:Object.keys(ndr).length};

function dateContext(){

  return "Dates (India time): "+days.join("; ")+".";
}
function rules(){

  return `You are ${st.agentName}, the delivery-help agent for ${st.signoff||S.profile.storeName}, an Indian online store. The courier (${S.profile.courier}) failed to deliver this buyer's parcel. You message the buyer (WhatsApp, or a phone call if noted) to get the parcel delivered, or to close it cleanly.

${dateContext()}

How to talk:
- If the buyer's language is Hindi or Hinglish, write Hinglish in Roman script; otherwise English. Mirror the buyer.
- Warm, short (under 35 words), one question at a time. "ji" politely in Hindi. First message: say who you are and which store, name the item, and say in plain words why today's delivery failed.

What to sort out, as needed:
- Do they still want it?${st.acceptReturns?" If not, accept the return politely without pushing.":" If not, hand off to the team (you may not accept returns yourself)."}
${st.fixAddress?"- If the address looks incomplete, get a house or flat number and a landmark.":"- Do not change addresses; if the address is wrong, hand off to the team."}
- A re-attempt date within the next ${st.maxDays} days, plus any instruction for the rider (call first, time window, deliver at shop).
${st.offerUpi?"- If the order is cash on delivery and cash is the problem, you may offer paying by UPI now.":"- Do not offer online payment."}
${st.flagFake?"- If the buyer says nobody came, nobody called, or they were home: apologise, flag it as a likely fake attempt, and still book a re-attempt.":""}
- If the buyer is upset about damage, wants an exchange or refund, or asks for a person: hand off to the team.
Never promise refunds, discounts, exact delivery times or anything about the courier beyond booking the attempt.

Actions (zero or more per turn, in order):
${st.fixAddress?'- {"type":"update_address","address":"<full new address>"}\n':''}${st.flagFake?'- {"type":"flag_fake_attempt","note":"<what the buyer said>"}\n':''}${st.offerUpi?'- {"type":"send_upi_link"}  (then stop and wait for payment)\n':''}- {"type":"reattempt","date":"YYYY-MM-DD","remarks":"<rider instruction or empty>"}  (final)
${st.acceptReturns?'- {"type":"return","reason":"<short reason>"}  (final)\n':''}- {"type":"handoff","reason":"<short reason for the store owner>"}  (final)
With a final action, your reply is the closing message.

Reply with ONLY a JSON object: {"reply":"<message to the buyer>","actions":[ ... ]}`;
}

function applyActions(s,cs,actions){
  const st=S.profile.settings; let final=false;
  for(const a of Array.isArray(actions)?actions:[]){
    if(!a||typeof a!=="object") continue; const t=String(a.type||"");
    if(t==="update_address"&&a.address&&st.fixAddress){ cs.address=String(a.address).slice(0,200); cs.addressFixed=true; cs.chat.push({who:"sys",text:"Address updated with the courier"}); addCall(cs,"POST","/api/p/edit",{waybill:s.ndr.awb,add:cs.address},{status:"success"},"Address updated"); }
    else if(t==="flag_fake_attempt"&&st.flagFake){ if(!cs.fake){cs.fake=true; cs.chat.push({who:"sys",text:"Flagged as a likely fake delivery attempt"}); addCall(cs,"POST","/escalations",{waybill:s.ndr.awb,type:"FAKE_ATTEMPT",buyer_said:String(a.note||"").slice(0,160)},{status:"logged"},"Fake attempt flagged");} }
    else if(t==="send_upi_link"&&st.offerUpi&&/cod|cash/i.test(s.order.payment)&&!cs.paid){ cs.status="awaiting_payment"; cs.chat.push({who:"sys",text:"UPI payment link sent"}); cs.chat.push({who:"pay"}); addCall(cs,"POST","/payments/links",{order_id:s.order.order_id,amount:Number(s.order.amount),method:"UPI"},{status:"created",expires_in:"30 min"},"UPI link sent"); return false; }
    else if(t==="reattempt"){ const date=/^\d{4}-\d{2}-\d{2}$/.test(String(a.date))?String(a.date):new Date(Date.now()+864e5).toLocaleDateString("en-CA",{timeZone:"Asia/Kolkata"}); cs.status="rebooked"; cs.reattempt=date; const body={waybill:s.ndr.awb,act:"RE-ATTEMPT",date}; if(a.remarks) body.remarks=String(a.remarks).slice(0,120); if(cs.paid) body.payment_mode="Prepaid"; addCall(cs,"POST","/api/p/update",body,{status:"success"},"Re-attempt booked"); cs.chat.push({who:"sys",text:"Re-attempt booked for "+date+(a.remarks?" · "+a.remarks:"")}); final=true; }
    else if(t==="return"&&st.acceptReturns){ cs.status="return"; addCall(cs,"POST","/api/p/update",{waybill:s.ndr.awb,act:"RTO",reason:String(a.reason||"Buyer declined").slice(0,120)},{status:"success"},"Return accepted"); cs.chat.push({who:"sys",text:"Return accepted"+(a.reason?": "+a.reason:"")}); final=true; }
    else if(t==="handoff"||(t==="return"&&!st.acceptReturns)){ cs.status="human"; cs.handoffReason=String(a.reason||"Needs a person").slice(0,160); addCall(cs,"POST","/api/p/update",{waybill:s.ndr.awb,act:"HOLD",remarks:"Store team will call buyer"},{status:"success"},"Held for your team"); cs.chat.push({who:"sys",text:"Passed to you: "+cs.handoffReason}); final=true; }
  }
  return final;
}
async function save(cs){ cs.updatedAt=nowISO(); try{ await store.saveCase(cs); }catch(e){ S.err=(e&&e.code==="quota_exceeded")?"Storage is full. Clear agent progress in Data sources.":"Couldn't save the latest change. It will retry with the next one."; } }
async function agentTurn(id,signal){
  if(!SAMPLE) throw {code:"not_declared"};
  const s=findShip(id), cs=caseOf(id);
  if(cs.status==="open") cs.status="talking";
  S.typing=id+":agent"; render();
  const out=await SAMPLE.json(`${rules()}\n\nThe order:\n${ctxOf(s)}\n\nConversation so far:\n${transcript(cs)}\n\nWrite the agent's next turn as the JSON object.`,{modelTier:"quick",cache:false,signal});
  const reply=out&&typeof out.reply==="string"&&out.reply.trim()?out.reply.trim():null;
  if(!reply) throw {code:"invalid_json"};
  cs.chat.push({who:"agent",text:reply,t:nowISO(),call:cs.channel==="call"});
  const fin=applyActions(s,cs,out.actions);
  S.typing=null; await save(cs); render();
  return fin;
}
async function buyerTurn(id,signal){
  if(!SAMPLE) throw {code:"not_declared"};
  const s=findShip(id), cs=caseOf(id);
  S.typing=id+":buyer"; render();
  const note=s.order.demo_buyer_note?`What you want: ${s.order.demo_buyer_note}.`:`Your parcel failed because: "${s.ndr.reason}". Behave like a typical Indian online shopper: most still want the parcel and pick a day; a few have a real problem.`;
  const {text}=await SAMPLE(`You are role-playing ${s.order.customer_name}, a buyer in ${s.order.city}, replying ${cs.channel==="call"?"on a phone call":"on WhatsApp"} to a store whose courier failed to deliver your parcel.
${note}
You speak ${s.order.language||"Hindi"} (Hindi/Hinglish in Roman script).
Your order: ${s.order.item}, ${rs(s.order.amount)}, ${/cod|cash/i.test(s.order.payment)?"cash on delivery":"prepaid"}. Address on file: ${addrOf(s)}.
${dateContext()}

Conversation so far:
${transcript(cs)}

Write ONLY your next reply: one short message, under 25 words, no quotes, no name prefix. Stay in character.`,{modelTier:"quick",cache:false,signal});
  cs.chat.push({who:"buyer",text:text.trim().replace(/^(buyer|customer|[A-Z][a-z]+)\s*:\s*/,"").replace(/^"|"$/g,"").slice(0,400),t:nowISO(),call:cs.channel==="call"});
  S.typing=null; await save(cs); render();
}
async function toCall(id,signal){
  const s=findShip(id), cs=caseOf(id); cs.channel="call";
  cs.chat.push({who:"sys",text:`No WhatsApp reply after ${S.profile.settings.voiceAfterHours} hours. ${S.profile.settings.agentName} calls in ${s.order.language||"Hindi"}.`});
  addCall(cs,"POST","/voice/calls",{to:s.order.phone,language:(s.order.language||"hindi").toLowerCase(),purpose:"failed_delivery",waybill:s.ndr.awb},{status:"connected"},"Voice call placed");
  return agentTurn(id,signal);
}
async function payNow(id){
  const cs=caseOf(id); if(cs.paid||S.busy) return; const s=findShip(id);
  cs.paid=true; cs.status="talking";
  addCall(cs,"POST","/webhooks/payment",{order_id:s.order.order_id,amount:Number(s.order.amount),status:"captured"},{status:"ok"},"UPI payment received");
  cs.chat.push({who:"sys",text:`Payment of ${rs(s.order.amount)} received. Order is now prepaid.`});
  cs.chat.push({who:"buyer",text:"Paid. Please send it.",t:nowISO()});
  await save(cs);
  run(sig=>agentTurn(id,sig));
}
async function resetCase(id){ if(S.busy) return; delete S.cases[id]; try{await store.deleteCase(id);}catch(e){} S.caseNote=""; render(); }
function explain(e){
  const c=e&&e.code; if(c==="cancelled") return "";
  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){liveOff=true;return "The agent needs permission to use Claude on your account. Reload the page and choose Allow.";}
  if(c==="rate_limited") return "Too many messages at once. Wait a minute, then continue.";
  if(c==="session_expired") return "Your Claude session ended. Sign in again, then continue.";
  if(c==="invalid_json") return "The agent's reply came back garbled. Try again.";
  if(c==="refused") return "The agent declined to answer that. Try rephrasing the buyer's reply.";
  return "The connection dropped. Try again.";
}
async function run(task){
  if(S.busy) return; S.busy=true; S.caseNote=""; ctl=new AbortController(); render();
  try{ await task(ctl.signal); }catch(e){ const m=explain(e); if(m){ S.caseNote=m; S.flash=m; } }
  finally{ S.busy=false; S.typing=null; ctl=null; render(); }
}
async function playOut(id,signal){
  let cs=caseOf(id);
  if(!cs.chat.length){ if(await agentTurn(id,signal)) return; }
  for(let i=0;i<6;i++){
    cs=caseOf(id);
    if(DONE.includes(cs.status)) return;
    if(cs.status==="awaiting_payment"){ const s=findShip(id); cs.paid=true; cs.status="talking"; addCall(cs,"POST","/webhooks/payment",{order_id:s.order.order_id,amount:Number(s.order.amount),status:"captured"},{status:"ok"},"UPI payment received"); cs.chat.push({who:"sys",text:`Payment of ${rs(s.order.amount)} received. Order is now prepaid.`}); cs.chat.push({who:"buyer",text:"Paid. Please send it.",t:nowISO()}); await save(cs); if(await agentTurn(id,signal)) return; continue; }
    await buyerTurn(id,signal);
    if(await agentTurn(id,signal)) return;
  }
}
function runAll(){
  const open=shipments().list.filter(s=>!DONE.includes(stOf(s.st)));
  if(!open.length) return;
  S.runAll={total:open.length,done:0,now:""};
  run(async sig=>{
    for(const s of open){ S.runAll.now=s.order.customer_name; S.sel=s.id; render(); await playOut(s.id,sig); S.runAll.done++; render(); }
    S.flash=`Done. ${open.length} deliveries worked through. Check Overview for the morning note.`;
  }).finally(()=>{S.runAll=null;render();});
}

  const who=h("div",{class:"card pad"},h("div",{class:"sect",text:"How it introduces itself"}),
    h("div",{class:"grid2"},fld("s-name","Agent's name","text",st.agentName,true),fld("s-sign","Store name in messages","text",st.signoff||S.profile.storeName,true)),
    h("div",{class:"sect",text:"Channels"}),
    h("div",null,tg("s-wa","WhatsApp","First message goes on WhatsApp.",true,true),tg("s-voice","Voice call if no reply","The agent calls in the buyer's language, 9am to 9pm only.",st.voice)),
    h("div",{class:"field"},h("label",{for:"s-after",text:"Call after (hours without a reply)"}),sel("s-after",["1","2","3","6","12"],String(st.voiceAfterHours))));
  const can=h("div",{class:"card pad"},h("div",{class:"sect",text:"What it can do without asking you"}),
    h("div",null,
      tg("s-re","Book re-attempts","Always on. The whole point.",true,true),

    h("div",{class:"field"},h("label",{for:"s-days",text:"Latest re-attempt it can book"}),sel("s-days",["2","3","4","5","6","7"].map(x=>x),String(st.maxDays)),h("span",{class:"hint",text:"Days from today. Anything later comes to you."})));
  out.push(h("div",{class:"setgrid"},who,can));

async function saveSettings(){
  const st={...S.profile.settings,agentName:$("s-name").value.trim()||"Asha",signoff:$("s-sign").value.trim()||S.profile.storeName,voice:$("s-voice").checked,voiceAfterHours:Number($("s-after").value),fixAddress:$("s-addr").checked,offerUpi:$("s-upi").checked,acceptReturns:$("s-ret").checked,flagFake:$("s-fake").checked,maxDays:Number($("s-days").value)};
  const p={...S.profile,settings:st,updatedAt:nowISO()};
  try{ await store.saveProfile(p); S.profile=p; S.flash="Saved. The agent will follow these from its next message."; }catch(e){ S.err="Couldn't save settings. Try again."; }
  render();
}

/* ---------- data ---------- */
function pageData(){
  const out=[h("div",{class:"phead"},h("div",null,h("h1",{text:"Data sources"}),h("p",{text:"Where your failed deliveries come from. Upload fresh files each evening, or connect your courier when live sync opens."})))];
  if(S.flash) out.push(h("p",{class:/n't|full/.test(S.flash)?"note err":"note ok",text:S.flash}));
  const sh=shipments();
  const files={}; for(const u of S.uploads){ const k=u.kind; if(!files[k]||u.uploadedAt>files[k].uploadedAt) files[k]=u; }
  const fcard=(kind,title,ic)=>{ const f=files[kind]; return h("div",{class:"card src"},
    h("div",{class:"top"},h("div",{class:"row"},h("div",{class:"ic",text:ic}),h("div",null,h("b",{text:title}),h("div",{class:"fine",text:"CSV upload"}))),h("span",{class:"chip dot c-rebooked",text:f?"Connected":"Empty"})),
    f?h("div",null,h("div",{style:"font-weight:600",text:f.name}),h("div",{class:"fine",text:`${f.count} rows · uploaded ${ist(f.uploadedAt)}`})):h("p",{class:"fine",text:"Nothing uploaded yet."})); };
  out.push(h("div",{class:"srcs"},fcard("orders","Orders","O"),fcard("ndr","Failed-delivery report","F"),liveCard()));
  out.push(h("p",{class:"fine",text:`${sh.list.length} failed deliveries matched to orders${sh.unmatched?`, ${sh.unmatched} without a matching order`:""}.`}));
  out.push(h("div",{class:"card pad"},h("div",{class:"sect",text:"Upload new files"}),h("p",{class:"fine",text:"New files replace the old ones. Conversations the agent already had are kept for matching AWB numbers."}),uploadPanel(true)));
  const clr=h("div",{class:"card pad"},h("div",{class:"sect",text:"Start fresh"}),h("p",{class:"fine",text:"Clear every conversation and courier action so the agent starts over on the current files. Your uploads stay."}));
  if(!S.confirmClear) clr.append(h("div",null,h("button",{class:"btn",type:"button",disabled:S.busy||!Object.keys(S.cases).length,onclick:()=>{S.confirmClear=true;render();},text:"Clear agent progress"})));
  else clr.append(h("div",{class:"row"},h("span",{text:`Clear ${Object.keys(S.cases).length} conversations? This can't be undone.`}),h("button",{class:"btn dark",type:"button",onclick:clearProgress,text:"Yes, clear them"}),h("button",{class:"btn ghost",type:"button",onclick:()=>{S.confirmClear=false;render();},text:"Cancel"})));
  out.push(clr);

async function clearProgress(){
  S.busy=true; render();
  try{ for(const id of Object.keys(S.cases)){ await store.deleteCase(id); } S.cases={}; S.flash="Cleared. The agent will start fresh."; }catch(e){ S.flash="Couldn't clear everything. Try again."; }
